<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<h1>Library</h1>
		<div class="books"></div>
		<dialog id="add-book">
			<form method="dialog">
				<h2>New Book</h2>
				<p>Add new Book to your Library!</p>
				<section>
					<p>
						<label for="title">Title</label>
						<input type="text" id="title" name="title" required />
					</p>
					<p>
						<label for="author">Author</label>
						<input type="text" id="author" name="author" required />
					</p>
					<p>
						<label for="pages">Pages</label>
						<input type="number" id="pages" name="pages" required />
					</p>
					<fieldset>
						<legend>Already read?</legend>
						<p>
							<label for="read">Read</label>
							<input
								type="radio"
								name="isRead"
								id="read"
								value="read"
							/>
						</p>
						<p>
							<label for="notRead">Not read</label>
							<input
								type="radio"
								name="isRead"
								id="notRead"
								value="notRead"
								checked
							/>
						</p>
					</fieldset>
				</section>
				<menu>
					<button class="button box-button" id="cancel" type="reset">
						Cancel
					</button>
					<button class="button blue box-button" type="submit">
						Add
					</button>
				</menu>
			</form>
		</dialog>
		<menu class="add-book">
			<button class="button blue" id="add-book-button">Add book</button>
		</menu>
		<script src="script.js"></script>
	</body>
</html>
